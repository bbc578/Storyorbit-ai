name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check frontend syntax
        run: node --check app/app.js

      - name: Check backend syntax
        run: python -m py_compile server/server.py

      - name: Secret pattern scan
        shell: bash
        run: |
          if grep -RInE 'sk-[A-Za-z0-9_-]{20,}|Bearer[[:space:]]+sk-' --exclude-dir=.git .; then
            echo "Potential secret found."
            exit 1
          fi
